name: Nightly Audit & Health Check

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 4:00 AM UTC
  workflow_dispatch:

concurrency:
  group: nightly-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Full Build, Datagen & GameTest Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Configurar Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-nightly-${{ hashFiles('gradle/gradle-wrapper.properties', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-nightly-
            ${{ runner.os }}-gradle-

      - name: Checagem de API e Estilo
        run: ./gradlew checkApiBoundaries spotlessCheck

      - name: Compilar Subprojetos e Addons
        run: ./gradlew assemble apiJar testClasses -x spotlessCheck

      - name: Executar Todos os GameTests (135 testes)
        run: ./gradlew test check -x spotlessCheck

      - name: Validar Integridade do DataGen
        run: |
          ./gradlew runDatagen
          git diff --exit-code src/main/generated
