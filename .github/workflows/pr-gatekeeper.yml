name: PR Gatekeeper (Quality & Security Gate)

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-gatekeeper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: Gatekeeper (Branch, Commits, API Boundaries, Spotless & GameTests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Nomenclatura da Branch (Axioma de Branches)
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validando branch: $BRANCH_NAME"
          # Permite branch 'dev' para PRs de promoção/release apontando para 'main'
          if [[ "${{ github.base_ref }}" == "main" && "$BRANCH_NAME" == "dev" ]]; then
            echo "✅ Promoção de release de 'dev' para 'main' autorizada."
            exit 0
          fi
          # Permite branches seguindo a regex: ^(feat|fix|test|refactor|chore|docs)/[a-z0-9-]+$
          REGEX="^(feat|fix|test|refactor|chore|docs)/[a-z0-9-]+$"
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "❌ ERRO: A branch '$BRANCH_NAME' viola o Axioma de Criação de Branches."
            echo "Formato esperado: <categoria>/<nome-da-task>"
            echo "Categorias permitidas: feat, fix, test, refactor, chore, docs (apenas letras minúsculas, números e hífens)."
            exit 1
          fi
          echo "✅ Nomenclatura de branch válida: $BRANCH_NAME"

      - name: Validar Sintaxe das Mensagens de Commits
        run: |
          echo "Validando mensagens de commit do PR..."
          COMMITS=$(git log --no-merges origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")
          COMMIT_REGEX="^(feat|fix|test|refactor|chore|docs|ci)(\([a-zA-Z0-9_-]+\))?(\/|:)[[:space:]]*.+"

          while IFS= read -r msg; do
            if [ -n "$msg" ]; then
              echo "Verificando commit: $msg"
              if [[ ! "$msg" =~ $COMMIT_REGEX ]]; then
                echo "❌ ERRO: Mensagem de commit fora da especificação: '$msg'"
                echo "Formato esperado: <category>(<scope>): <short-description>"
                exit 1
              fi
            fi
          done <<< "$COMMITS"
          echo "✅ Todas as mensagens de commit seguem a especificação."

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Configurar Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-pr-${{ hashFiles('gradle/gradle-wrapper.properties', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pr-
            ${{ runner.os }}-gradle-

      - name: Validar Separação da API e Formatação Spotless
        run: ./gradlew checkApiBoundaries spotlessCheck

      - name: Validar Consistência dos Dados Gerados (DataGen)
        run: |
          echo "Verificando se todos os assets e dados JSON estão atualizados via DataGen..."
          ./gradlew runDatagen
          if ! git diff --exit-code src/main/generated; then
            echo "❌ ERRO: O repositório contém alterações pendentes de DataGen não commitadas em src/main/generated!"
            echo "Execute './gradlew runDatagen' localmente e commite os arquivos gerados."
            exit 1
          fi
          echo "✅ Todos os recursos gerados por DataGen estão sincronizados e válidos."

      - name: Executar Suíte Completa de GameTests (Servidor Headless Fabric)
        run: ./gradlew test check -x spotlessCheck

      - name: Compilar e Remapear JARs de Produção (Fabric Loom Build)
        run: ./gradlew build apiJar -x test -x spotlessCheck

      - name: Auditoria Aprofundada de Integridade do Mod Fabric (.jar)
        run: |
          echo "Executando auditoria profunda no pacote .jar gerado..."
          python3 - << 'EOF'
          import zipfile, sys, os, glob

          jars = [f for f in glob.glob("build/libs/Galacticraft-*.jar") if not any(x in f for x in ["-sources", "-javadoc", "-dirty"])]
          if not jars:
              print("❌ ERRO: Nenhum JAR do Galacticraft encontrado em build/libs/!")
              sys.exit(1)

          mod_jar = sorted(jars, key=os.path.getmtime, reverse=True)[0]
          size = os.path.getsize(mod_jar)
          print(f"JAR sob auditoria: {mod_jar} ({size} bytes)")

          if size < 20_000_000:
              print(f"❌ ERRO: Tamanho do JAR ({size} bytes) abaixo do threshold mínimo esperado de 20MB!")
              sys.exit(1)

          with zipfile.ZipFile(mod_jar, "r") as z:
              files = set(z.namelist())

              # 1. Metadados Fabric e Mixins
              required_meta = [
                  "fabric.mod.json",
                  "galacticraft.mixins.json",
                  "galacticraft-api.mixins.json"
              ]
              for meta in required_meta:
                  if meta not in files:
                      print(f"❌ ERRO: Metadado obrigatório '{meta}' ausente no JAR!")
                      sys.exit(1)

              # 2. Entrypoints principais do mod e cliente
              entrypoints = [
                  "dev/galacticraft/mod/Galacticraft.class",
                  "dev/galacticraft/mod/GalacticraftClient.class",
                  "dev/galacticraft/impl/internal/fabric/GalacticraftAPI.class"
              ]
              for entry in entrypoints:
                  if entry not in files:
                      print(f"❌ ERRO: Entrypoint '{entry}' não encontrado no JAR compilado!")
                      sys.exit(1)

              # 3. Presença de assets fundamentais
              has_assets = any(f.startswith("assets/galacticraft/") for f in files)
              if not has_assets:
                  print("❌ ERRO: Diretório de assets 'assets/galacticraft/' ausente no JAR!")
                  sys.exit(1)

          print("✅ Auditoria profunda do JAR Fabric concluída com sucesso absoluto!")
          EOF

      - name: Publicar JARs de Produção como Artefato do PR
        uses: actions/upload-artifact@v4
        with:
          name: galacticraft-fabric-1.21.1-PR${{ github.event.pull_request.number || github.sha }}
          path: |
            build/libs/Galacticraft-*.jar
          retention-days: 14

      - name: Validação Estrita de Promoção para Main (Release Gate)
        if: github.base_ref == 'main'
        run: |
          echo "=========================================================="
          echo "🚀 RELEASE PROMOTION GATE (dev -> main)"
          echo "Todos os 135 GameTests foram validados."
          echo "JAR de produção verificado e empacotado para release."
          echo "=========================================================="
